version: "3"

networks:
  castopod:
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    volumes:
      - ../..:/workspaces:cached
    environment:
      CI_ENVIRONMENT: development
      vite_environment: development
      app_forceGlobalSecureRequests: 0 #false
      app_baseURL: http://localhost:8080/
      media_baseURL: http://localhost:8080/
      admin_gateway: cp-admin
      auth_gateway: cp-auth
      analytics_salt: dev_analytics_salt
      database_default_hostname: mariadb
      database_default_database: castopod 
      database_default_username: castopod
      database_default_password: castopod
      database_default_DBPrefix: cp_
      restapi_enabled: 1 #true
      email_fromEmail: hello@castopod.local
      email_SMTPCrypto: ""
      email_SMTPHost: mailpit
      email_SMTPUser: castopod
      email_SMTPPass: castopod
      email_SMTPPort: 1025
    depends_on:
      - redis
      - mariadb
    networks:
      castopod:
        ipv4_address: 172.31.0.2

  redis:
    image: redis:alpine
    volumes:
      - redis:/data
    ports:
      - 6379:6379
    networks:
      castopod:
        ipv4_address: 172.31.0.3

  mariadb:
    image: mariadb:10.2
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - mariadb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: castopod
      MYSQL_USER: castopod
      MYSQL_PASSWORD: castopod
    networks:
      castopod:
        ipv4_address: 172.31.0.4

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    ports:
      - 8888:80
    volumes:
      - phpmyadmin:/sessions
    depends_on:
      - mariadb
    networks:
      castopod:
        ipv4_address: 172.31.0.5

  mailpit:
    image: axllent/mailpit
    restart: always
    volumes:
      - mailpit:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      castopod:
        ipv4_address: 172.31.0.6

  nextcloud:
    image: nextcloud:latest
    container_name: castopod_nextcloud
    environment:
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=castopod
      - MYSQL_USER=castopod
      - MYSQL_PASSWORD=castopod
    volumes:
      - ./nextcloud/init_nextcloud.sh:/docker-entrypoint-hooks.d/before-starting/init_nextcloud.sh
      - nextcloud:/var/www/html
    ports:
      - 8090:80
    depends_on:
      - mariadb
    networks:
      castopod:
        ipv4_address: 172.31.0.7

volumes:
  redis:
  mariadb:
  phpmyadmin:
  mailpit:
  nextcloud:
